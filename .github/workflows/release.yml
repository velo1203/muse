# Builds Muse installers on GitHub's runners and attaches them to a draft release.
# Run it from the Actions tab ("Run workflow") or by pushing a tag like v0.1.0.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            # One .dmg that runs on both Apple Silicon and Intel Macs
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Muse v__VERSION__
          releaseBody: |
            ## 설치
            - **Windows**: `Muse_*_x64-setup.exe` 를 실행하세요. (또는 `.msi`)
            - **macOS**: `Muse_*_universal.dmg` 를 열고 Muse를 응용 프로그램 폴더로 끌어다 놓으세요.
              서명되지 않은 앱이라 처음 실행할 때 "확인되지 않은 개발자" 경고가 나오면, 시스템 설정 → 개인정보 보호 및 보안에서 "그래도 열기"를 누르세요.

            곡을 받으려면 yt-dlp가 필요해요. 앱 안의 "yt-dlp 자동 설치" 버튼으로 설치할 수 있어요.
            MP3/M4A 변환·볼륨 측정·파일 가져오기에는 ffmpeg가 필요해요 (Windows: `winget install Gyan.FFmpeg`, macOS: `brew install ffmpeg`).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
